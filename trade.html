<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; connect-src https://api.bybit.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="page-version" content="19.2">
<title>Сделка</title>
<link rel="stylesheet" href="trade.css?v=19.2">
</head>
<body>
<div id="app">
  <header class="top">
    <div id="title" class="title">Сделка</div>
    <div id="subtitle" class="subtitle"></div>
  </header>
  <div id="banners" class="banners"></div>
  <div id="fatal" class="fatal" hidden></div>

  <main id="main" hidden>
    <ul id="errs" class="msgs errs" aria-live="polite"></ul>
    <div id="modeBar" class="mode-bar">
      <div id="sideBar" class="seg" role="group" aria-label="Сторона"></div>
      <div id="kindBar" class="seg" role="group" aria-label="Вид входа"></div>
    </div>
    <div id="chartWrap" class="chart-wrap">
      <div id="chart" class="chart" aria-label="График со стопом, целью и ценой заявки"></div>
      <div id="chartMsg" class="chart-msg" hidden></div>
    </div>
    <div id="summary" class="summary" aria-live="polite"></div>
    <div class="toolbar">
      <div id="tfBar" class="seg small" role="group" aria-label="Свечи"></div>
      <span id="src" class="src"></span>
      <button id="refresh" class="btn small" type="button">Обновить</button>
    </div>

    <div id="lines" class="lines"></div>
    <div id="tpBar" class="tp-bar" role="group" aria-label="Цель"></div>
    <div id="c3Bar" class="c3-bar" role="group" aria-label="Вторая цель и трейлинг"></div>
    <button id="ruleBtn" class="btn wide" type="button">По правилу бота</button>
    <div id="status" class="status" aria-live="polite"></div>

    <div id="risk" class="risk" hidden></div>
    <div id="calc" class="calc"></div>
    <ul id="infos" class="msgs infos"></ul>
    <ul id="warns" class="msgs warns"></ul>

    <div id="pageButtons" class="page-buttons">
      <button id="cancelBtn" class="btn" type="button">Отмена</button>
      <button id="sendBtn" class="btn primary" type="button" disabled>Отправить</button>
    </div>
    <div id="sendErr" class="send-err" hidden></div>
  </main>

  <footer class="foot">
    График: <a id="tvAttr" href="https://www.tradingview.com/" rel="noopener noreferrer">TradingView Lightweight Charts™</a>, © TradingView, Inc.
  </footer>
</div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="trade_rules.js?v=19.2"></script>
<script src="trade.js?v=19.2"></script>
</body>
</html>
